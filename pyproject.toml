[project]
name = "complaint-triage"
version = "0.1.0"
description = "Complaint triage service: PII redaction, classification, RG 271 deadlines, safe abstain."
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
